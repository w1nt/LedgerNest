spring.application.name=SpringBoot_demo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
# Apply schema.sql with the administrator script; runtime credentials need only DML.
spring.sql.init.mode=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.address=${SERVER_ADDRESS:127.0.0.1}
# Proxy headers are not identities. Configure a trusted edge explicitly for public deployments.
server.forward-headers-strategy=none
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=16KB
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=10s
server.tomcat.threads.max=50
server.tomcat.accept-count=50
server.tomcat.max-connections=200
spring.jdbc.template.query-timeout=5s
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.transaction.default-timeout=10s
app.security.session-absolute-lifetime=8h
app.security.requests-per-minute=600
app.security.logins-per-minute=30
app.security.registrations-per-quarter-hour=10
app.security.login-failures-per-quarter-hour=5
