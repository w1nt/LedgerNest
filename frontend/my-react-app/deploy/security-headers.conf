# Nginx location/server include：默认同源 /api 部署。跨域 API 时同步修改 connect-src。
# 该文件是部署配置示例；实际生产站点必须加载这些响应头，不能仅依赖 HTML meta。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
# HTML 与 API 使用 no-store；带内容哈希的静态资源可以在独立 location 中按需缓存。
add_header Cache-Control "no-store" always;
# 仅在 HTTPS server 中启用 HSTS；本机 HTTP 开发不发送此响应头。
# add_header Strict-Transport-Security "max-age=31536000" always;
